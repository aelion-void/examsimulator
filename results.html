<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            padding: 24px;
            border: 1px solid #e2e8f0;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
            color: #1e293b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .metric-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        .metric-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.05);
        }

        .metric-card.correct {
            background: rgba(16, 185, 129, 0.04);
            border-color: rgba(16, 185, 129, 0.2);
        }
        .metric-card.correct .metric-value { color: #10b981; }

        .metric-card.wrong {
            background: rgba(239, 68, 68, 0.04);
            border-color: rgba(239, 68, 68, 0.2);
        }
        .metric-card.wrong .metric-value { color: #ef4444; }

        .metric-card.skipped {
            background: rgba(100, 116, 139, 0.04);
            border-color: rgba(100, 116, 139, 0.2);
        }
        .metric-card.skipped .metric-value { color: #64748b; }

        .metric-card.accuracy {
            background: rgba(59, 130, 246, 0.04);
            border-color: rgba(59, 130, 246, 0.2);
        }
        .metric-card.accuracy .metric-value { color: #3b82f6; }

        .metric-value {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .metric-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
        }

        .controls {
            background: white;
            padding: 1rem;
            border-radius: 50px;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 1rem;
            z-index: 10;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            background: #f1f5f9;
            color: #475569;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn.active {
            background: #3b82f6;
            color: white;
        }

        .btn:hover:not(.active) {
            background: #e2e8f0;
            color: #3b82f6;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .question-result {
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            border-bottom-width: 4px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }

        .question-result.correct {
            background: #f0fdf4;
            border-color: #10b981;
        }

        .question-result.wrong {
            background: #fef2f2;
            border-color: #ef4444;
        }

        .question-result.skipped {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 0.5rem;
            padding-right: 100px;
        }

        .question-number {
            color: #475569;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }

        .question-text {
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.5;
            flex: 1;
        }

        .your-answer-text {
            font-size: 14px;
            font-weight: 600;
            margin-top: 0.25rem;
            padding-left: 38px;
        }

        .your-answer-text.wrong { color: #ef4444; }
        .your-answer-text.correct { color: #10b981; }
        .your-answer-text.skipped { color: #64748b; }

        .status-badge {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge.correct {
            background: #d1fae5;
            color: #059669;
        }

        .status-badge.wrong {
            background: #fee2e2;
            color: #ef4444;
        }

        .status-badge.skipped {
            background: #f1f5f9;
            color: #475569;
        }

        .answer-section {
            display: none;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-left: 38px;
        }

        .question-result.expanded .answer-section {
            display: block;
        }

        .answer-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 1rem;
            margin-bottom: 0.8rem;
            font-size: 14px;
        }

        .answer-label {
            font-weight: 600;
            color: #666;
        }

        .answer-value {
            color: #333;
            word-break: break-word;
            line-height: 1.5;
        }

        .answer-value.correct {
            color: #10b981;
            font-weight: 500;
        }

        .answer-value.wrong {
            color: #ef4444;
            font-weight: 500;
        }

        .back-btn {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            margin-top: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .back-btn a {
            display: inline-block;
            padding: 12px 32px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-btn a:hover {
            background: #1d4ed8;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="paperTitle">Exam Results</h1>
            <div class="stats-grid">
                <div class="metric-card correct">
                    <div class="metric-value" id="correctCount">0</div>
                    <div class="metric-label">Correct</div>
                </div>
                <div class="metric-card wrong">
                    <div class="metric-value" id="wrongCount">0</div>
                    <div class="metric-label">Wrong</div>
                </div>
                <div class="metric-card skipped">
                    <div class="metric-value" id="skippedCount">0</div>
                    <div class="metric-label">Skipped</div>
                </div>
                <div class="metric-card accuracy">
                    <div class="metric-value" id="accuracy">0%</div>
                    <div class="metric-label">Accuracy</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn active" onclick="filterResults('all')">All Answers</button>
            <button class="btn" onclick="filterResults('correct')">✓ Correct</button>
            <button class="btn" onclick="filterResults('wrong')">✗ Wrong</button>
            <button class="btn" onclick="filterResults('skipped')">- Skipped</button>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="empty-state">Loading results...</div>
        </div>

        <div class="back-btn">
            <a href="index.html">Back to Home</a>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="results.js"></script>
</body>
</html>
