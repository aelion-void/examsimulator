<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 1.5rem;
            color: #333;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #2563eb;
        }

        .stat-card.correct {
            border-left-color: #10b981;
        }

        .stat-card.wrong {
            border-left-color: #ef4444;
        }

        .stat-card.skipped {
            border-left-color: #9ca3af;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .controls {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .btn:hover {
            border-color: #2563eb;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .question-result {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #2563eb;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .question-result.correct {
            border-left-color: #10b981;
        }

        .question-result.wrong {
            border-left-color: #ef4444;
        }

        .question-result.skipped {
            border-left-color: #9ca3af;
        }

        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 1rem;
        }

        .question-number {
            background: #2563eb;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .question-result.correct .question-number {
            background: #10b981;
        }

        .question-result.wrong .question-number {
            background: #ef4444;
        }

        .question-result.skipped .question-number {
            background: #9ca3af;
        }

        .question-text {
            font-size: 15px;
            color: #333;
            line-height: 1.6;
            flex: 1;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .status-badge.correct {
            background: #d1fae5;
            color: #065f46;
        }

        .status-badge.wrong {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-badge.skipped {
            background: #f3f4f6;
            color: #374151;
        }

        .answer-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }

        .answer-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 1rem;
            margin-bottom: 0.8rem;
            font-size: 14px;
        }

        .answer-label {
            font-weight: 600;
            color: #666;
        }

        .answer-value {
            color: #333;
            word-break: break-word;
            line-height: 1.5;
        }

        .answer-value.correct {
            color: #10b981;
            font-weight: 500;
        }

        .answer-value.wrong {
            color: #ef4444;
            font-weight: 500;
        }

        .back-btn {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            margin-top: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .back-btn a {
            display: inline-block;
            padding: 12px 32px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-btn a:hover {
            background: #1d4ed8;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="paperTitle">Exam Results</h1>
            <div class="stats-grid">
                <div class="stat-card correct">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">Correct</div>
                </div>
                <div class="stat-card wrong">
                    <div class="stat-value" id="wrongCount">0</div>
                    <div class="stat-label">Wrong</div>
                </div>
                <div class="stat-card skipped">
                    <div class="stat-value" id="skippedCount">0</div>
                    <div class="stat-label">Skipped</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="accuracy">0%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn active" onclick="filterResults('all')">All Answers</button>
            <button class="btn" onclick="filterResults('correct')">✓ Correct</button>
            <button class="btn" onclick="filterResults('wrong')">✗ Wrong</button>
            <button class="btn" onclick="filterResults('skipped')">- Skipped</button>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="empty-state">Loading results...</div>
        </div>

        <div class="back-btn">
            <a href="index.html">Back to Home</a>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="results.js"></script>
</body>
</html>
