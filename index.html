<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Exam Practice </title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1> Exam Simulator </h1>

    <div class="card">

        <h2>Import Question Paper</h2>

        <input
            type="file"
            id="paperFile"
            accept=".txt"
        >

        <button id="importBtn">
            Import Paper
        </button>

    </div>

    <div class="card">

        <h2>Imported Papers</h2>

        <div id="paperList">

            <p>No papers imported.</p>

        </div>

    </div>

</div>

<script src="parser.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>

</body>
</html>
