<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="exam-header">

<button id="newAttemptBtn" onclick="newAttempt()" style="padding: 10px 20px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; height: fit-content;">
        New Attempt
    </button>
    
    <div>
        <h2 id="paperTitle">Question Paper</h2>
        <p id="sectionInfo">Section 1 / 4</p>
    </div>
    <div class="timers">
        <div class="timer-box">
            <small>Total Time</small>
            <h2 id="totalTimer">60:00</h2>
        </div>
        <div class="timer-box">
            <small>Section Time</small>
            <h2 id="sectionTimer">15:00</h2>
        </div>
    </div>
    
</header>

<div class="exam-layout">

    <!-- Question Area -->

    <main class="question-panel">

        <div class="question-number">
            Question
            <span id="questionNumber">1</span>
            /
            <span id="totalQuestions">100</span>
        </div>

        <div
            id="questionText"
            class="question-text">

            Loading Question...

        </div>

        <div
            id="optionsContainer"
            class="options">

            <!-- Generated by exam.js -->

        </div>

        <div class="question-buttons">

            <button id="previousBtn">
                Previous
            </button>

            <button id="markBtn">
                Mark for Review
            </button>

            <button id="saveNextBtn">
                Save & Next
            </button>

        </div>

    </main>

    <!-- Question Palette -->

    <aside class="palette">

        <h3>Question Palette</h3>

        <div
            id="questionPalette"
            class="palette-grid">

        </div>

        <button
            id="submitExamBtn"
            class="submit-btn">

            Submit Exam

        </button>

    </aside>

</div>

<script src="storage.js"></script>
<script src="exam.js"></script>

</body>
</html>
