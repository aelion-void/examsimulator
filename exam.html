<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Start Modal Overlay -->
    <div id="startModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Ready to begin?</h2>
            <p>You have 60 minutes to complete this exam.</p>
            <button id="startExamBtn" class="pill-btn green-btn"
                style="font-size: 18px; padding: 12px 32px; margin-top: 20px;">Start Exam</button>
        </div>
    </div>

    <header class="exam-header">
        <div class="header-left">
            <h2 id="paperTitle">Question Paper</h2>
        </div>

        <div class="header-right">
            <div class="timer-pill" id="totalTimer">60:00</div>

            <button id="exitBtn" class="pill-btn grey-btn">Exit</button>
            <button id="submitExamBtn" class="pill-btn green-btn">Submit</button>
            <button id="togglePaletteBtn" class="pill-btn blue-btn">☰</button>
        </div>
    </header>

    <div class="exam-layout">

        <!-- Question Area -->

        <main class="question-panel">

            <div class="question-number">
                Question
                <span id="questionNumber">1</span>
                /
                <span id="totalQuestions">100</span>
            </div>

            <div id="questionText" class="question-text">

                Loading Question...

            </div>

            <div id="optionsContainer" class="options">

                <!-- Generated by exam.js -->

            </div>

            <div class="question-buttons">

                <button id="previousBtn">
                    Previous
                </button>

                <button id="markBtn">
                    Mark for Review
                </button>

                <button id="saveNextBtn">
                    Save & Next
                </button>

            </div>

        </main>

        <!-- Question Palette -->

        <aside class="palette" id="paletteAside">

            <h3>Question Palette</h3>

            <div id="questionPalette" class="palette-grid">

            </div>

        </aside>

    </div>

    <script src="storage.js"></script>
    <script src="exam.js"></script>

</body>

</html>
